services:
  web:
    image: node:22
    labels:
      base44.project: "Horizon Café — کافه هورایزن"
      base44.kind: web
      base44.port: "3000"
    working_dir: /app
    command: sh -ec "npm install --no-audit --no-fund && exec npm run dev"
    ports:
      - "3000:5173"
    environment:
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    restart: on-failure
    healthcheck:
      test: ["CMD", "sh", "-c", "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  node_modules:
